name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Pinned with the toolchain directive in go.mod and the build image.
  GO_VERSION: "1.27.1"

jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "unformatted files:"
            echo "$unformatted"
            exit 1
          fi

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go test ./...

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go test -race ./...

  integration:
    runs-on: ubuntu-latest
    services:
      valkey:
        image: valkey/valkey:9.1.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      HOOKRELAY_TEST_VALKEY_URL: valkey://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go test ./...

  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go vet ./...

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build linux/amd64
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/hookrelay ./cmd/hookrelay
          test -x /tmp/hookrelay

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build production container
        run: |
          docker build \
            --build-arg VERSION="${GITHUB_SHA::7}" \
            --build-arg COMMIT="${GITHUB_SHA::7}" \
            --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg DIRTY="$( [ -n "$(git status --porcelain)" ] && echo true || echo false )" \
            -t hookrelay:ci .
      - name: Verify embedded version metadata and runtime user
        run: |
          version="$(docker run --rm hookrelay:ci version --json)"
          echo "$version"
          test "$(jq -r .version <<<"$version")" = "${GITHUB_SHA::7}"
          test "$(jq -r .commit <<<"$version")" = "${GITHUB_SHA::7}"
          test "$(jq -r .build_time <<<"$version")" != "unknown"
          user="$(docker image inspect --format '{{.Config.User}}' hookrelay:ci)"
          echo "runtime user: $user"
          test -n "$user" && test "$user" != "root" && test "$user" != "0"

  smoke:
    # The Compose smoke is the Milestone 1–3 exit criterion: the vertical
    # slice and the failure path (retries, DLQ, CLI replay) against the
    # pinned stack in production mode, including a restart that keeps the
    # Valkey volume and expires a lease left claimed, then notification
    # wake-up and credential replacement through the Admin CLI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compose smoke
        run: scripts/smoke.sh
